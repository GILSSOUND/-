<!DOCTYPE html>
<html>
<body>
<input type="file" id="fileInput" />
<button onclick="upload()">Upload</button>
<pre id="log"></pre>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
async function upload() {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('image', file);
  try {
    const res = await axios.post(`https://api.imgbb.com/1/upload?key=aaa7883871d2df3a5f6e47a2ed97e0f8`, formData);
    document.getElementById('log').innerText = "Success: " + JSON.stringify(res.data);
  } catch (err) {
    document.getElementById('log').innerText = "Error: " + err.message + "\n" + (err.response ? JSON.stringify(err.response.data) : "");
  }
}
</script>
</body>
</html>
